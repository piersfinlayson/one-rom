# archive.toml - past editions of the One ROM documentation set.
#
# These are documents whose version has already moved on, rendered from the git
# ref they shipped at so a reader still on that release can fetch the edition
# matching their build.  The text comes from the object store, so building one
# needs no checkout and leaves the working tree alone.
#
# Deliberately NOT part of docs.toml.  An entry there is built whenever its
# release cycle runs, and this one rides the CLI's - so every CLI release would
# rebuild a past edition and re-stage it over the bytes readers already have,
# with a different checksum the moment the stylesheet moves.  Build this set on
# demand instead:
#
#   ci/build-docs.sh <dest-prefix> --config docs/pdf/archive.toml
#
# It shares docs.css, template.html and render.py with the live set, so an
# archive edition is the old text printed by the current press - it is not a
# reproduction of a PDF that never existed at the time.

[project]
name = "One ROM"
url = "https://onerom.org"
repo = "one-rom"
file_prefix = "onerom-"
cover_notice = "Copyright © {year} Piers Finlayson <piers@piers.rocks> · MIT licence"
footer_notice = "© {year} Piers Finlayson · onerom.org · MIT licence"

[papers.a4]
size = "A4"
height = "297mm"

[papers.letter]
size = "Letter"
height = "279mm"

# A past edition states its version rather than reading it from the tree, which
# describes the present.
[version_sources.cli]
label = "One ROM CLI v{version}"
version = "0.3.0"

# CLI 0.3.0 is the release currently published on images.onerom.org, so this is
# the manual matching the CLI a reader can download today.  The ref is the CLI's
# own release tag rather than the firmware tag that happens to share its commit.
[[documents]]
source = "docs/CLI-MANUAL.md"
slug = "cli-manual"
version_source = "cli"
version_banner = "as of release v{version}"
ref = "cli-v0.3.0"
