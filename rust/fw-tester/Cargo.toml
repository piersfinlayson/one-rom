[package]
name = "onerom-fw-tester"
version = "0.1.0"
edition = "2024"
# Workspace-internal: needs CONFIG/BOARD and a firmware C tree to build.
publish = false
authors = ["Piers Finlayson <piers@piers.rocks>"]
license = "MIT"
description = "Tests One ROM emulated firmware"
repository = "https://github.com/piersfinlayson/one-rom"
homepage = "https://onerom.org"
keywords = ["retro", "rom", "commodore", "embedded"]
categories = ["embedded", "hardware-support"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pio-tester"
path = "src/bin/pio_tester/main.rs"

[[bin]]
name = "plugin-api-tester"
path = "src/bin/plugin_api_tester/main.rs"

[[bin]]
name = "address-monitor-tester"
path = "src/bin/address_monitor_tester/main.rs"

[dependencies]
onerom-config = { workspace = true }
onerom-gen = { workspace = true }
onerom-fw = { workspace = true }
onerom-fw-emulator = { workspace = true }
onerom-fw-geometry = { workspace = true }
onerom-metadata = { workspace = true }

serde_json = "1"
log  = "0.4"
env_logger = "0.11"
rand = "0.10"
[lints]
workspace = true
