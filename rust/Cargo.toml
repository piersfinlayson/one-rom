# Workspace configuration for the Rust elements of the One ROM project
[workspace]
members = [
    "app",
    "cli",
    "config",
    "database",
    "fw",
    "fw-config-gen",
    "fw-driver",
    "fw-emulator",
    "fw-geometry",
    "fw-tester",
    "fw-parser",
    "gen",
    "lab",
    "lens",
    "metadata",
    "plugin-tester",
    "protocol",
    "schema-gen",
    "studio",
]
default-members = [
    "app",
    "cli",
    "config",
    "database",
    "fw",
    "fw-config-gen",
    "fw-parser",
    "gen",
    "metadata",
    "protocol",
    "schema-gen",
    "studio",
]
resolver = "2"

# Lints applied across the workspace.  Members opt in with `[lints] workspace =
# true`.
[workspace.lints.clippy]
# Several types we consume are `#[non_exhaustive]` — including our own
# `onerom_gen::Error` — so a `match` on them needs a wildcard arm and the
# compiler can no longer tell us when a new variant appears.  This lint fills
# that gap: it stays quiet while every known variant is listed explicitly, and
# fires on the wildcard as soon as one is added.  Combined with `-D warnings`
# in `ci/rust-lint.sh` that makes a new variant a build failure rather than
# something silently absorbed.
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
onerom-app = { path="app", version="0.2.0" }
onerom-cli = { path="cli", version="0.3.0" }
onerom-config = { path="config", version="0.6.0" }
onerom-database = { path="database", version="0.1.2" }
onerom-fw = { path="fw", version="0.2.0" }
onerom-fw-driver = { path="fw-driver", version="0.1.0" }
onerom-fw-emulator = { path="fw-emulator", version="0.1.0" }
onerom-fw-geometry = { path="fw-geometry", version="0.1.0" }
onerom-fw-parser = { path="fw-parser", version="0.8.0" }
onerom-fw-tester = { path="fw-tester", version="0.1.0" }
onerom-gen = { path="gen", version="0.7.0" }
onerom-metadata = { path="metadata", version="0.1.4" }
onerom-protocol = { path="protocol", version="0.1.1" }

[profile.release]
opt-level = 3
#lto = true
codegen-units = 1
strip = true
panic = "abort"
