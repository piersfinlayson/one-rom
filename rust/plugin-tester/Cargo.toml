[package]
name = "onerom-plugin-tester"
version = "0.1.0"
edition = "2024"
# Workspace-internal: the testers built on it need CONFIG/BOARD and a firmware
# C tree to build.
publish = false
authors = ["Piers Finlayson <piers@piers.rocks>"]
license = "MIT"
description = "Runs One ROM plugins against the emulated firmware on a host"
repository = "https://github.com/piersfinlayson/one-rom"
homepage = "https://onerom.org"
keywords = ["retro", "rom", "commodore", "embedded"]
categories = ["embedded", "hardware-support"]

[dependencies]
onerom-fw-emulator = { workspace = true }

[lints]
workspace = true
