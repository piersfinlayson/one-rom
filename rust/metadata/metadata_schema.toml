# ===========================================================================
# Type aliases
# ===========================================================================

[[type_aliases]]
name = "fire_freq_t"
underlying = "u16"
comment = """RP2350 clock frequency in MHz.
Special values: FIRE_FREQ_STOCK, FIRE_FREQ_NONE."""

# ===========================================================================
# Enums
# ===========================================================================
# 'size'         - byte size, verified by STATIC_ASSERT or __attribute__((packed))
# 'packed'       - true if __attribute__((packed)) is required in C
# 'strip_prefix' - common prefix to remove when deriving Rust variant names
# 'source'       - when set to "rbcp_chip_types", enum variants are generated
#                  from hw-config/chip-types.json rather than listed here;
#                  see build/c_gen.rs for the generation contract
# Variant flags:
#   sentinel = true  - generates as a pub const, not a Rust enum variant
#   alias_for        - generates as a constant alias for another variant

[[enums]]
name = "onerom_rom_type_t"
size = 1
comment = "ROM/EPROM/EEPROM chip type"
strip_prefix = "CHIP_TYPE_"
# source: when set to "rbcp_chip_types", enum variants are generated from
# hw-config/chip-types.json (via the rbcp_chip_type field on each chip entry)
# rather than being listed here.  The C generator emits one CHIP_TYPE_<NAME>
# variant per non-alias chip sorted by rbcp value, appends NUM_CHIP_TYPES and
# INVALID_CHIP_TYPE sentinels, emits a #define for each alias chip (e.g.
# CHIP_TYPE_23C1010), and emits the onerom_chip_type_sizes[] array under
# #if defined(ONEROM_CONSTANTS).
# No Rust enum is generated for this type; consumers use
# ChipType::try_from_rbcp_u8() from the onerom_config crate instead.
source = "rbcp_chip_types"

