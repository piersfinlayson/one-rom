# ===========================================================================
# Structs
# ===========================================================================
# 'size'            - byte size where a STATIC_ASSERT exists in the C source
# 'root'            - true for the struct placed at metadata_base
# 'generate'        - "both" | "parse" | "none"
# 'expected_offset' - per-field: offset verified by STATIC_ASSERT in C source

[[structs]]
name = "onerom_info_t"
comment = """Main OneROM information structure.
Placed in flash by the C firmware build at a fixed location.
Not generated by the Rust pre-processor; parsed only."""
generate = "parse"
size = 64

[[structs.fields]]
name = "magic"
kind = "inline_array"
element = "u8"
count = 4
expected_const = "ONEROM_INFO_MAGIC"
comment = "Magic bytes: See ONEROM_INFO_MAGIC const"

[[structs.fields]]
name = "major_version"
kind = "scalar"
type = "u16"
comment = "Firmware major version"

[[structs.fields]]
name = "minor_version"
kind = "scalar"
type = "u16"
comment = "Firmware minor version"

[[structs.fields]]
name = "patch_version"
kind = "scalar"
type = "u16"
comment = "Firmware patch version"

[[structs.fields]]
name = "build_number"
kind = "scalar"
type = "u16"
comment = "Firmware build number"

[[structs.fields]]
name = "build_date"
kind = "cstr_ptr"
nullable = false
comment = "Pointer to build date/time string"

[[structs.fields]]
name = "commit"
kind = "inline_array"
element = "u8"
count = 8
comment = "Git commit hash, null-terminated, 8 bytes"

[[structs.fields]]
name = "version"
kind = "scalar"
type = "u32"
comment = "Info structure version (ONEROM_INFO_VERSION)"

[[structs.fields]]
name = "metadata"
kind = "struct_ptr"
type = "onerom_metadata_header_t"
nullable = true
comment = "Pointer to the metadata header (at metadata_base)"

[[structs.fields]]
name = "rtt"
kind = "opaque_ptr"
nullable = true
comment = "Pointer to SEGGER RTT control block"

[[structs.fields]]
name = "runtime"
kind = "struct_ptr"
type = "onerom_runtime_info_t"
nullable = true
none_on_parse_error = true
comment = """Pointer to runtime info structure.
Points into RAM; on a stopped device that RAM is absent or stale, so a failed
parse (e.g. bad magic) yields None rather than failing the whole struct."""

[[structs.fields]]
name = "reserved"
kind = "padding"
size = 24
comment = "Pad to 64 bytes. Set to 0xFF."

# ---

[[structs]]
name = "onerom_metadata_header_t"
comment = """OneROM metadata header.
Root of the 16KB metadata region, placed at metadata_base.
All sub-structures must be 4-byte aligned."""
generate = "both"
size = 256
root = true

[[structs.fields]]
name = "magic"
kind = "inline_array"
element = "u8"
count = 16
comment = "Magic: 'ONEROM_METADATA\\0' (ONEROM_METADATA_MAGIC)"

[[structs.fields]]
name = "version"
kind = "scalar"
type = "u32"
comment = "Metadata version (CURRENT_METADATA_VERSION)"

[[structs.fields]]
name = "hw"
kind = "struct_ptr"
type = "onerom_hardware_info_t"
nullable = false
comment = "Hardware information. Mandatory."

[[structs.fields]]
name = "fw"
kind = "struct_ptr"
type = "onerom_firmware_config_t"
nullable = false
comment = "Firmware configuration. Mandatory."

[[structs.fields]]
name = "rom_slot_count"
kind = "scalar"
type = "u8"
comment = "Number of populated ROM slots"

[[structs.fields]]
name = "boot_logging"
kind = "scalar"
type = "u8"
comment = "Enable boot logging (currently requires SWD). 0=off, 1=on."

[[structs.fields]]
name = "swd_enabled"
kind = "scalar"
type = "u8"
comment = "Enable SWD. 0=off, 1=on."

[[structs.fields]]
name = "turbo_boot"
kind = "scalar"
type = "u8"
comment = "Enable fast boot, disabling image select jumper reading. 0=off, 1=on."

[[structs.fields]]
name = "rom_slots"
kind = "struct_array_ptr"
element = "onerom_rom_slot_t"
count_field = "rom_slot_count"
nullable = false
comment = "Pointer to array of ROM slots (rom_slot_count entries)"

[[structs.fields]]
name = "reserved"
kind = "padding"
size = 220
comment = "Reserved for future expansion. Set to 0xFF."

# ---

[[structs]]
name = "onerom_hardware_info_t"
comment = "Metadata: physical board hardware information"
generate = "both"
size = 128

[[structs.fields]]
name = "hw_rev"
kind = "cstr_ptr"
nullable = false
comment = "Hardware revision string. Must be present."

[[structs.fields]]
name = "rp235x"
