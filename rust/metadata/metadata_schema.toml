comment = "GPIO for status LED. GPIO_NONE if not present."

[[structs.fields]]
name = "gpio_neopixel"
kind = "scalar"
type = "u8"
comment = "GPIO for Neopixel LED. GPIO_NONE if not present."

[[structs.fields]]
name = "gpio_swdio"
kind = "scalar"
type = "u8"
comment = "GPIO also connected to SWDIO. GPIO_NONE if not present."

[[structs.fields]]
