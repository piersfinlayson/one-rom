comment = "GPIO also connected to SWCLK. GPIO_NONE if not present."

[[structs.fields]]
name = "reserved1"
kind = "padding"
size = 3

[[structs.fields]]
name = "gpio_sel"
kind = "inline_array"
element = "u8"
count = 7
