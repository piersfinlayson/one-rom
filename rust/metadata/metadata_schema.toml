# OneROM Metadata Type Schema
#
# Source of truth for OneROM C header and Rust type/code generation.
#
# This allows for this single file to modified when adding/changing/removing
# metadata or other firmware fields and the corresponding Rust code to both
# parse and generate firmware blobs.
#
# This avoids the needs to keep C and Rust code in sync manually.
#
# While the C header `firmware/generated/onerom_metadata.h` is generated from
# this file, the C code to use it must be hand-written.  See in particular
# `firmware/src/globals.c`.
#
# Do not use `\n` inside comment strings - use """ triple-quoted strings"""
# for multi-line comments instead.  The Rust code generator inserts newlines
# as needed.
#
# ---------------------------------------------------------------------------
# Schema sections
# ---------------------------------------------------------------------------
#   [schema]          - metadata, addresses, codegen options
#   [[constants]]     - #define constants (C) / pub const (Rust)
#   [[type_aliases]]  - typedef uint16_t aliases
#   [[enums]]         - typedef enum types
#   [[structs]]       - fixed-layout structs
#   [[tagged_fams]]   - variable-length structs with discriminant (Rust enums)
#   [[simple_fams]]   - variable-length structs: length prefix + byte array
#
# ---------------------------------------------------------------------------
# Field kinds (used in struct/tagged_fam fields)
# ---------------------------------------------------------------------------
#   scalar            - u8, u16, u32
#   enum              - reference to an [[enums]] entry
#   type_alias        - reference to a [[type_aliases]] entry
#   inline_array      - fixed-size array, element + count
#   inline_array2d    - fixed 2D array, element + rows + cols
#   cstr_ptr          - const char* null-terminated string pointer
#   struct_ptr        - const T* pointer to struct (nullable flag)
#   struct_array_ptr  - const T* as array, length from count_field
#   struct_ptr_array_ptr - const T* const * (double-indirect array + count_field)
#   tagged_fam_ptr    - pointer to a [[tagged_fams]] type
#   simple_fam_ptr    - pointer to a [[simple_fams]] type
#   opaque_ptr        - void* pointer, stored as Pointer, not dereferenced
#   fn_ptr            - function pointer, stored as Pointer, not dereferenced
#   padding           - reserved bytes: present in C/binary, absent from Rust type
#
# ---------------------------------------------------------------------------
# Field-level attributes
# ---------------------------------------------------------------------------
#   nullable            - cstr_ptr/struct_ptr: null pointer yields None rather
#                         than ParseError::NullPointer
#   expected_const      - inline_array: name of a generated constant whose bytes
#                         the parsed array must begin with; a mismatch yields
#                         ParseError::BadMagic. Used for struct magic fields.
#   none_on_parse_error - nullable struct_ptr/tagged_fam_ptr/simple_fam_ptr: a
#                         non-null pointer whose target fails to parse yields
#                         None rather than propagating the error. Used where the
#                         target may be absent or stale (e.g. a runtime pointer
#                         into RAM on a stopped device).
#
# ---------------------------------------------------------------------------
# 'generate' field values
# ---------------------------------------------------------------------------
#   "both"   - C definition + Rust parse + Rust serialize
#   "parse"  - C definition + Rust parse only
#   "none"   - C definition only

[schema]
version = 1
name = "OneROM"
description = "OneROM firmware metadata structures"
flash_base   = 0x10000000    # RP2350 flash base address
metadata_base = 0x1000C000   # flash_base + 48KB: root of metadata region
metadata_size = 16384        # 16KB reserved for metadata
root_struct = "onerom_metadata_header_t"

