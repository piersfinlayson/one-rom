[package]
name = "onerom-metadata"
version = "0.3.0"
edition = "2024"
authors = ["Piers Finlayson <piers@piers.rocks>"]
license = "MIT"
description = "One ROM metadata handling"
repository = "https://github.com/piersfinlayson/one-rom"
homepage = "https://onerom.org"
documentation = "https://docs.rs/onerom-config"
keywords = ["retro", "rom", "embedded"]
categories = ["embedded", "hardware-support"]
build = "build/main.rs"
# Test-only. See build/main.rs.
exclude = [
    "build/gating_fixture.toml",
    "tests/generation_roundtrip.rs",
    "tests/fixture_device.rs",
]

[lib]
name = "onerom_metadata"
 
[dependencies]
onerom-config = { workspace = true }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
pico-otp = { git = "https://github.com/piersfinlayson/pico-otp", rev = "358876cfe06c36278cd554b11053ec42af85851d", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-big-array = "0.5"
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
onerom-metadata-gen = { workspace = true }

[dev-dependencies]
onerom-metadata-gen = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml  = { version = "1.1" }
[lints]
workspace = true
